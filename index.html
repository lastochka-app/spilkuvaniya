<!DOCTYPE html>
<html lang="uk">
<head>
    <title>Соціальна мережа</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        :root {
            /* Classic Mail.ru 2000s Colors */
            --bg-body: #FFFFFF;
            --panel-head: #DAE5F4;
            --panel-bg: #F3F7FB;
            --border-main: #88AADD;
            --border-dark: #336699;
            --text-main: #000000;
            --text-sub: #666666;
            
            --primary: #003399; /* Mail.ru Classic Blue */
            --orange: #FF9900;  /* Mail.ru Classic Orange */
            --link-color: #0033CC;
            --link-hover: #FF0000;
            
            --danger: #CC0000;
            --verified: #FF9900;
        }

        /* Скасовуємо темну тему для автентичності 2000-х */
        [data-theme="dark"] {
            --bg-body: #EAEAEA;
            --panel-head: #CCCCCC;
            --panel-bg: #DDDDDD;
            --text-main: #000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: Tahoma, Verdana, Arial, sans-serif; 
            font-size: 11px; 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        a { color: var(--link-color); text-decoration: underline; cursor: pointer; }
        a:hover { text-decoration: none; color: var(--link-hover); }

        .ambient-bg { display: none; }

        /* Classic Table-like Boxes */
        .glass-panel, .card { 
            background: var(--panel-bg); 
            border: 1px solid var(--border-main); 
            border-radius: 0; 
            margin-bottom: 8px;
        }

        /* Classic Header */
        .header-logo { 
            font-size: 24px; 
            font-weight: bold; 
            padding: 12px 20px; 
            background: #FFFFFF;
            color: var(--primary);
            border-bottom: 3px solid var(--orange); 
            z-index: 10;
            font-family: Arial, Helvetica, sans-serif;
            position: relative;
        }
        
        .header-logo::before {
            content: "✉";
            color: var(--blue);
            margin-right: 2px;
            font-size: 28px;
            vertical-align: middle;
        }

        .header-logo::after {
            content: "BETA";
            font-size: 9px;
            background: transparent;
            color: var(--danger);
            padding: 0;
            border: none;
            vertical-align: super;
            margin-left: 5px;
            font-weight: normal;
        }

        .tab-header, .section-title { 
            font-size: 11px; 
            font-weight: bold; 
            color: var(--text-main); 
            background: var(--panel-head);
            border-bottom: 1px solid var(--border-main); 
            padding: 4px 8px;
            display: block;
        }
        
        .tab-header {
            margin-bottom: 8px;
            border: 1px solid var(--border-main);
        }

        .section-title { 
            margin: 0 0 8px 0; 
        }

        .text-sub { color: var(--text-sub); font-size: 10px; }
        .icon-verified { color: var(--verified); font-weight: bold; font-family: Arial;}

        #auth-box { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding-top: 50px; z-index: 2; overflow-y: auto; background: #E0EBF5;}
        
        #main-ui { 
            display: none; flex: 1; width: 100%; max-width: 1000px; margin: 0 auto; padding: 5px; 
            overflow: hidden; position: relative; 
            background: #FFFFFF;
        }
        
        .column { display: flex; flex-direction: column; height: 100%; overflow-y: auto; padding: 0 4px; scrollbar-width: thin; }
        
        #col-left { width: 180px; flex-shrink: 0; } 
        #col-main { flex: 1; min-width: 0; }
        #col-right { width: 200px; flex-shrink: 0; }

        .card { padding: 8px; }
        .card-auth { 
            width: 100%; max-width: 320px; text-align: left; padding: 15px; 
            background: #FFFFFF; border: 1px solid var(--border-dark); 
        }

        /* Classic OS Inputs */
        input, textarea, select { 
            width: 100%; background: #FFFFFF; border: 1px solid #7F9DB9; color: #000; 
            border-radius: 0; padding: 3px 4px; font-size: 11px; font-family: Tahoma, sans-serif; 
            margin-bottom: 8px; outline: none;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--primary); } 
        .form-label { display: block; text-align: left; font-size: 11px; color: #000; margin-bottom: 2px; }

        /* Classic Buttons */
        button { 
            font-family: Tahoma, sans-serif; font-size: 11px; border-radius: 0; 
            cursor: pointer; padding: 3px 10px; text-decoration: none;
            border: 1px solid #707070; background: #E4E4E4; color: #000;
        }
        button:active { background: #CCCCCC; }
        
        .btn-primary { 
            background: var(--orange); color: #FFF; border: 1px solid #CC6600; font-weight: bold;
        }
        .btn-primary:hover { background: #FF8800; }
        
        .btn-secondary { 
            background: #F0F0F0; border: 1px solid #999; color: #000;
        }
        .btn-secondary:hover { background: #E0E0E0; }
        
        .btn-text { background: transparent; color: var(--link-color); border: none; text-decoration: underline; padding: 0;}
        .btn-text:hover { text-decoration: none; color: var(--link-hover); background: transparent; }
        
        .btn-danger { background: #CC0000; color: #FFF; border: 1px solid #990000; }
        
        .btn-dashed { background: transparent; border: 1px dashed var(--border-main); color: var(--link-color); }
        .btn-dashed:hover { background: #FFF; }
        
        /* Sidebar Navigation */
        .btn-nav { 
            display: block; width: 100%; text-align: left; background: transparent; color: var(--link-color); 
            margin-bottom: 2px; padding: 4px 6px; border: none; border-bottom: 1px solid #EAEAEA;
            text-decoration: underline; font-weight: normal; 
        }
        .btn-nav:hover { background: var(--panel-head); text-decoration: none; color: var(--link-hover); border-bottom: 1px solid var(--border-main); }

        /* Avatars with classic borders */
        .avatar-lg { width: 100px; height: 100px; object-fit: cover; border: 1px solid #000; }
        .avatar-md { width: 50px; height: 50px; object-fit: cover; border: 1px solid #000; }
        .avatar-sm { width: 32px; height: 32px; object-fit: cover; border: 1px solid #000; }
        
        .list-item { display: flex; align-items: center; gap: 6px; padding: 4px; cursor: pointer; border-bottom: 1px dotted var(--border-main); }
        .list-item:hover { background: #FFFFCC; }
        .list-item b { font-weight: normal; font-size: 11px; color: var(--link-color); text-decoration: underline; }
        .list-item:hover b { color: var(--link-hover); text-decoration: none; }
        
        /* Posts - Table style */
        .post { margin-bottom: 12px; border: 1px solid var(--border-main); background: #FFFFFF; }
        .post-header { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; background: var(--panel-head); font-size: 11px; border-bottom: 1px solid var(--border-main); }
        .post-body { padding: 8px; font-size: 12px; line-height: 1.4; color: #000; overflow-wrap: anywhere;}
        .post-footer { padding: 4px 6px; background: var(--panel-bg); display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--border-main); }
        .img-fluid { width: 100%; max-height: 420px; object-fit: contain; border: 1px solid #000; margin-top: 5px; }
        
        .btn-like { background: #FFF; border: 1px solid var(--border-main); color: #000; padding: 2px 6px; }
        .btn-like.active { background: #FFEBEB; border-color: #CC0000; color: #CC0000; font-weight: bold; }
        .btn-delete { color: var(--danger); font-size: 10px; text-decoration: none;}

        /* Chat */
        #chat-window { display: none; flex-direction: column; height: 100%; border: 1px solid var(--border-dark); background: #FFF; }
        #chat-header { display: flex; justify-content: space-between; align-items: center; padding: 6px; background: var(--primary); color: #FFF; font-weight: bold; font-size: 12px; }
        #chat-header .btn-text { color: #FFF; text-decoration: underline; }
        #messages-list { flex: 1; padding: 8px; overflow-y: auto; display: flex; flex-direction: column; background: #FFFFFF; }
        .chat-input-area { display: flex; gap: 4px; padding: 6px; border-top: 1px solid var(--border-dark); background: #E0EBF5; }
        
        .msg-row { display: flex; align-items: flex-start; gap: 6px; border-bottom: 1px dotted #CCC; padding: 4px 0; }
        .msg-row.me { background: #FFFFE0; }
        .msg-bubble { flex: 1; }
        .msg-meta { font-size: 10px; margin-bottom: 2px; color: var(--text-sub); }
        .msg-meta b { color: var(--primary); font-size: 11px;}
        
        .mobile-nav { display: none; }
        .desktop-only { display: block; } .mobile-only { display: none; }

        .flex-row { display: flex; gap: 4px; align-items: center; }
        .mt-15 { margin-top: 10px; }
        .mt-20 { margin-top: 15px; }
        .scroll-area { overflow-y: auto; scrollbar-width: thin; }

        .ad-banner {
            border: 1px solid #000; margin-bottom: 8px; cursor: pointer; background: #FFF; text-align: center;
        }
        .ad-banner img { width: 100%; height: auto; display: block; }
        .ad-badge {
            display: block; background: var(--orange); color: #FFF; font-size: 9px; padding: 1px; 
            text-align: center; font-weight: bold; text-transform: uppercase;
        }

        #notification-container { position: fixed; bottom: 5px; right: 5px; z-index: 10000; width: 220px; }
        .toast { 
            background: #FFFFCC; border: 1px solid #FFCC00; color: #000; padding: 6px; margin-top: 4px; 
            font-size: 11px; cursor: pointer;
        }

        /* Responsive - making it rigid but usable */
        @media (max-width: 850px) {
            #main-ui { flex-direction: column; display: block; overflow-y: auto; padding: 0;}
            .column { display: none; width: 100% !important; height: auto; overflow: visible; padding: 4px;}
            .column.active-mob { display: flex; padding-bottom: 30px; } 
            .mobile-only { display: block !important; }
            .desktop-only { display: none !important; }
            
            .mobile-nav { 
                display: flex; position: fixed; bottom: 0; left: 0; right: 0; height: 30px; 
                background: #E4E4E4; border-top: 1px solid #999; 
                justify-content: space-between; align-items: center; z-index: 999; 
            }
            .mobile-nav button { 
                flex: 1; height: 100%; border: none; border-right: 1px solid #999;
                background: transparent; color: #000; font-size: 10px; padding: 0;
            }
            .mobile-nav button:last-child { border-right: none; }
            
            #profile-card { flex-direction: column !important; align-items: center !important; text-align: center; }
            .flex-row { flex-wrap: wrap; }
        }

        /* Стилі для каналів */
        .channel-banner { width: 100%; height: 100px; object-fit: cover; border-bottom: 1px solid #000; }
        .channel-header-info { padding: 5px 5px 5px 70px; background: #FFF; position: relative; border-bottom: 1px solid var(--border-main);}
        .channel-avatar { position: absolute; top: -30px; left: 5px; width: 60px; height: 60px; border: 1px solid #000; object-fit: cover; background: #FFF; }
        .channel-badge { background: var(--orange); color: #FFF; font-size: 9px; padding: 1px 3px; vertical-align: super; }
    </style>
</head>
<body>

    <div id="notification-container"></div>
    <div class="header-logo" id="global-logo">Завантаження...</div>

    <div id="auth-box">
        <div class="card-auth">
            <div class="section-title" style="margin: -15px -15px 10px -15px; padding: 8px;">Авторизація</div>
            
            <label class="form-label">E-mail адрес:</label>
            <input type="email" id="my-email-input" placeholder="name@domain.com">
            
            <label class="form-label">Пароль:</label>
            <input type="password" id="my-pass-input">
            
            <label class="form-label">Нікнейм (для реєстрації):</label>
            <input type="text" id="my-nick-input">
            
            <label class="form-label">Фото (URL):</label>
            <input type="text" id="my-avatar-input" value="http://">
            
            <div style="margin-top: 15px; text-align: center;">
                <button class="btn-primary" style="width: 100%; margin-bottom: 5px; padding: 5px;" onclick="handleAuth('login')">Увійти</button>
                <div style="font-size: 10px; color: #666; margin: 5px 0;">-- АБО --</div>
                <button class="btn-secondary" style="width: 100%; padding: 5px;" onclick="handleAuth('reg')">Реєстрація</button>
            </div>
        </div>
    </div>

    <div id="main-ui">
        
        <div class="column" id="col-left">
            <div class="card" style="text-align: center; background: #FFF;">
                <img id="my-avatar-img" src="" class="avatar-lg" alt="Avatar">
                <div id="display-nick" style="font-weight:bold; color: var(--primary); margin-top: 5px;"></div>
            </div>
            
            <div class="card" style="padding: 0; background: transparent; border: none;">
                <div class="section-title" style="margin-bottom: 0;">Мій Профіль</div>
                <div style="background: #FFF; border: 1px solid var(--border-main); padding: 4px; margin-bottom: 8px;">
                    <button class="btn-nav" onclick="loadFeed()">Головна сторінка</button>
                    <button class="btn-nav" onclick="switchTab('col-main'); showWall();">Моя сторінка</button>
                    <button class="btn-nav" onclick="loadSubscriptionsTab()">Мої підписки</button>
                    <button class="btn-nav" onclick="showMailClient()">Пошта (@)</button> 
                    <button class="btn-nav" onclick="loadFavoritesTab()">Обрані контакти</button>
                </div>

                <div class="section-title" style="margin-bottom: 0;">Сервіси</div>
                <div style="background: #FFF; border: 1px solid var(--border-main); padding: 4px; margin-bottom: 8px;">
                    <button class="btn-nav" onclick="showChannelsList()">Канали</button>
                    <button class="btn-nav" onclick="showVideos()">Відеозаписи</button>
                    <button class="btn-nav" onclick="showSearchEngine()">Пошук</button>
                </div>

                <div class="section-title" style="margin-bottom: 0;">Налаштування</div>
                <div style="background: #FFF; border: 1px solid var(--border-main); padding: 4px;">
                    <button class="btn-nav" id="admin-nav-btn" style="display: none; color: var(--danger);" onclick="showAdminPanel()">Адміністрування</button>
                    <button class="btn-nav" onclick="showSettings()">Особисті дані</button>
                    <button class="btn-nav" onclick="showAbout()">Про проект</button>
                </div>
            </div>

            <div class="desktop-only card" style="padding: 0;">
                <div class="section-title" style="margin-bottom: 0;">Чати</div>

                    <div class="scroll-area public-chats-list-class" style="max-height: 100px;"></div>
                    <button class="btn-nav" style="color: #666; font-size: 10px;" onclick="createPublicChat()">[+] Додати чат</button>
                </div>

                <div class="section-title" style="margin: 8px 0 0 0;">Групи</div>
                <div style="background: #FFF; border: 1px solid var(--border-main); padding: 2px;">
                    <div class="scroll-area groups-list-class" style="max-height: 100px;"></div>
                    <button class="btn-nav" style="color: #666; font-size: 10px;" onclick="createGroup()">[+] Створити групу</button>
                </div>
            </div>
        </div>

        <div class="column active-mob" id="col-main">
            
            <div id="profile-screen" style="display:flex; flex-direction:column; height:100%;">
                
                <div class="card" id="profile-card" style="display:flex; align-items:flex-start; gap:10px; background: #FFF;">
                    <img id="view-avatar" class="avatar-lg" alt="User">
                    <div style="flex:1;">
                        <div style="font-size:16px; font-weight:bold; color: var(--primary); border-bottom: 1px solid var(--border-main); padding-bottom: 2px; margin-bottom: 4px;">
                            <span id="view-nick"></span> <span id="view-badges"></span>
                        </div>
                        <span id="view-id-label" class="text-sub"></span>
                        <div style="font-size:11px; margin-top:5px; color: #000;">

                        <div class="flex-row mt-15">
                            <button class="btn-primary" id="write-btn" style="display:none;">Написати</button>
                            <button class="btn-secondary" id="follow-btn" style="display:none;">Підписатися</button>
                            <button class="btn-secondary" id="fav-btn" style="display:none;">В обране</button>
                        </div>
                    </div>
                </div>

                <div id="inbox-area" class="card" style="display:none; padding: 0;">
                    <div class="section-title" style="margin:0;">Нові повідомлення</div>
                    <div id="inbox-list" style="background:#FFF; border:1px solid var(--border-main); padding:2px;"></div>
                </div>

                <div class="mobile-only" style="margin-bottom: 8px;">
                    <button class="btn-secondary" id="admin-mob-btn" style="display: none; color: var(--danger); width:100%; margin-bottom:4px;" onclick="showAdminPanel()">Адмінка</button>
                    <button class="btn-secondary" style="width:100%;" onclick="showSettings()">Налаштування</button>
                </div>

                <div id="wall-input-area" class="card" style="background: var(--panel-head); margin-top: 8px;">

                    <textarea id="post-text" rows="3" style="margin-bottom: 4px; border: 1px solid #707070;"></textarea>
                    <input type="text" id="post-img-url" placeholder="http://... (URL картинки)" style="margin-bottom: 4px; border: 1px solid #707070;">
                    <div style="text-align: right;">
                        <button class="btn-primary" onclick="createPost()">Надіслати</button>
                    </div>
                </div>
                
                <div id="wall-posts" class="scroll-area" style="margin-top: 8px;"></div>
            </div>

            <div id="chat-window">
                <div id="chat-header">
                    <button class="btn-text" onclick="switchTab('col-left')">&laquo; Назад</button>
                    <span id="chat-title">ДІАЛОГ</span>
                    <button class="btn-text" onclick="loadMessages()">Оновити</button>
                </div>
                <div id="messages-list"></div>
                <div class="chat-input-area">
                    <button class="btn-secondary" onclick="sendImagePrompt()">IMG</button>
                    <input type="text" id="msg-input" placeholder="Текст..." onkeyup="if(event.keyCode===13) sendMessage()" style="margin:0; flex:1;">

            <div class="mobile-only card" style="padding: 0;">
                <div class="section-title" style="margin: 0;">Чати</div>
                <div style="background: #FFF; border: 1px solid var(--border-main); padding: 2px; margin-bottom: 8px;">
                    <div class="scroll-area public-chats-list-class" style="max-height: 100px;"></div>
                    <button class="btn-nav" style="color: #666; font-size: 10px;" onclick="createPublicChat()">[+] Додати</button>
                </div>
                <div class="section-title" style="margin: 0;">Групи</div>
                <div style="background: #FFF; border: 1px solid var(--border-main); padding: 2px;">
                    <div class="scroll-area groups-list-class" style="max-height: 100px;"></div>
                    <button class="btn-nav" style="color: #666; font-size: 10px;" onclick="createGroup()">[+] Створити</button>
                </div>
            </div>

            <div class="card" style="padding: 0;">
                <div class="section-title" style="margin:0;">Знайти користувача</div>
                <div style="background: #FFF; border: 1px solid var(--border-main); padding: 4px;">
                    <input type="text" id="target-id-input" placeholder="UUID..." style="margin-bottom: 4px;">
                    <button class="btn-secondary" style="width:100%;" onclick="goToId()">Шукати</button>
                </div>
            </div>
            
            <div class="card mt-15" style="padding: 0;">
                <div class="section-title" style="margin:0;">Люди</div>
                <div id="users-list" class="scroll-area" style="background: #FFF; border: 1px solid var(--border-main); padding: 2px; max-height: 250px;"></div>
            </div>

            <div class="card mt-15" style="padding: 0;">
                <div class="section-title" style="margin:0;">Канали</div>
                <div id="recommended-channels-list" class="scroll-area" style="background: #FFF; border: 1px solid var(--border-main); padding: 2px; max-height: 250px;"></div>
            </div>
        </div>
    </div>

    <div class="mobile-nav" id="mob-nav">
        <button onclick="loadFeed()">Головна</button>
        <button onclick="switchTab('col-main'); showWall();">Профіль</button>
        <button onclick="switchTab('col-main'); showChannelsList();">Канали</button>
        <button onclick="switchTab('col-main'); showMailClient();">Пошта</button>
        <button onclick="switchTab('col-right')">Інше</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://enbrqdtmnlqenxmhxkad.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_MAwfGgVLp7EnFZ6wq7U65g_Sl7kZ_Hn'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let myId, myNick, currentChatId;
        let myInternalEmail = null; 
        let myIsAdmin = false;
        let myRestrictPosts = false, myRestrictGroups = false, myRestrictChatFirst = false;
        
        let globalAppInfo = { name: "Bigion", desc: "Конфіденційна соціальна мережа" };
        const DEFAULT_AVATAR = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRLCFpHxyg6G5c4uQQy6U5SlgJr6qq6P6ot7Q&s";
        let userCache = {};

        window.onload = async () => {
            await fetchGlobalSettings();
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) setTheme(savedTheme);
            const savedBg = localStorage.getItem('custom_bg');
            if (savedBg) { document.body.style.backgroundImage = `url('${savedBg}')`; document.body.style.backgroundSize = 'auto'; document.body.style.backgroundRepeat = 'repeat'; }
            
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                await loadCurrentUserProfile(session.user.id);
            }

            _supabase.auth.onAuthStateChange(async (event, session) => {
                if (event === 'SIGNED_IN' && session) {
                    await loadCurrentUserProfile(session.user.id);
                } else if (event === 'SIGNED_OUT') {
                    location.reload();
                }
            });
        };

        async function fetchGlobalSettings() {
            const { data } = await _supabase.from('global_settings').select('*').eq('id', 1).single();
            if (data) {
                globalAppInfo.name = data.app_name || "Bigion";
                globalAppInfo.desc = data.app_desc || "";
                document.getElementById('global-logo').innerText = globalAppInfo.name;
                document.title = globalAppInfo.name;
                if(data.color_primary) {
                    document.documentElement.style.setProperty('--primary', data.color_primary);
                    document.documentElement.style.setProperty('--link-color', data.color_primary); 
                }
            }
        }

        async function loadCurrentUserProfile(userId) {

        async function handleAuth(mode) {
            const email = document.getElementById('my-email-input').value.trim();
            const pass = document.getElementById('my-pass-input').value.trim();
            const nick = document.getElementById('my-nick-input').value.trim();
            let av = document.getElementById('my-avatar-input').value.trim() || DEFAULT_AVATAR;

            if (!email || !pass) {
                alert("Введіть email та пароль!"); return;
            }

            if (mode === 'reg') {
                if (!nick) { alert("Помилка: Нікнейм обов'язковий для реєстрації!"); return; }
                const { data, error } = await _supabase.auth.signUp({
                    email: email,
                    password: pass,
                    options: { data: { nickname: nick } }
                });
                if (error) { alert("Помилка: " + error.message); return; }
                if (data.user) {
                    await _supabase.from('profiles').update({ avatar_url: av }).eq('id', data.user.id);
                    alert("Реєстрація успішна! Увійдіть з вашими даними.");
                }
            } else if (mode === 'login') {
                const { error } = await _supabase.auth.signInWithPassword({
                    email: email,
                    password: pass
                });
                if (error) alert("Помилка входу! Перевірте дані: " + error.message);
            }
        }

        async function createPost() {

            const t = document.getElementById('post-text').value.trim();
            const img = document.getElementById('post-img-url').value.trim();
            
            if(!t && !img) return;
            
            const finalContent = img ? `${t}\n\n${img}` : t;
            
            await _supabase.from('posts').insert([{ author_id: myId, text: finalContent, likes: 0, liked_by: [] }]);
            
            document.getElementById('post-text').value = "";
            document.getElementById('post-img-url').value = "";

        }

            const box = document.getElementById(`comments-box-${postId}`);

        async function loadComments(postId) {
            const listEl = document.getElementById(`comments-list-${postId}`);
            if(!listEl) return;
            const { data: comments } = await _supabase.from('comments').select('*').eq('post_id', postId).order('created_at', { ascending: true });
            
            if(!comments || comments.length === 0) { listEl.innerHTML = '<span class="text-sub" style="font-size:11px;">Коментарів немає.</span>'; return; }

            const authorIds = [...new Set(comments.map(c => c.author_id))];
            const { data: users } = await _supabase.from('profiles').select('id, nickname, avatar_url, is_verified, is_admin').in('id', authorIds);
            if(users) users.forEach(u => userCache[u.id] = u);

            listEl.innerHTML = comments.map(c => {
                const user = userCache[c.author_id] || { nickname: `Користувач`, avatar_url: DEFAULT_AVATAR };
                const canDeleteComment = (c.author_id === myId || myIsAdmin);
                let b = user.is_verified ? `<span style="color:var(--verified); font-size:10px;">[v]</span>` : '';
                if (user.is_admin) b += ' [A]';

                return `
                    <div style="padding:4px; border-bottom:1px dotted var(--border-main); display:flex; gap:6px;">
                        <img src="${user.avatar_url || DEFAULT_AVATAR}" class="avatar-sm" style="cursor:pointer;" onclick="viewProfile('${c.author_id}')">
                        <div style="flex:1;">
                            <div style="font-size:11px; font-weight:bold; margin-bottom:2px;">
                                <a onclick="viewProfile('${c.author_id}')">${user.nickname}</a> ${b}
                                <span class="text-sub" style="font-weight:normal;">${new Date(c.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                            </div>
                            <div style="font-size:11px;">${parseContent(c.text)}</div>
                        </div>
                        ${canDeleteComment ? `<a style="color:var(--danger); font-size:10px; cursor:pointer;" onclick="deleteComment('${c.id}', '${postId}')">[x]</a>` : ''}
                    </div>
                `;
            }).join('');
        }

        async function moderateUser(action, status) {
            const targetId = document.getElementById('admin-target-id').value.trim();
            if(!targetId) { alert("Вкажіть UUID!"); return; }
            const { data } = await _supabase.from('profiles').select('*').eq('id', targetId).single();
            if(!data) { alert("Не знайдено!"); return; }
            if (action === 'verify') await _supabase.from('profiles').update({ is_verified: status }).eq('id', targetId);
            else if (action === 'ban') await _supabase.from('profiles').update({ is_banned: status }).eq('id', targetId);
            alert(`Виконано.`); loadUsers();
        }

        async function moderateRestriction(type, status) {
            const targetId = document.getElementById('admin-target-id').value.trim();
            if(!targetId) { alert("Вкажіть UUID!"); return; }
            let fieldsToUpdate = {};
            if(type === 'posts') fieldsToUpdate = { restrict_posts: status };
            else if(type === 'groups') fieldsToUpdate = { restrict_groups: status };
            else if(type === 'chat_first') fieldsToUpdate = { restrict_chat_first: status };
            else if(type === 'clear_all') fieldsToUpdate = { restrict_posts: false, restrict_groups: false, restrict_chat_first: false };
            await _supabase.from('profiles').update(fieldsToUpdate).eq('id', targetId);
            alert(`Виконано.`); loadUsers();
        }

            const targetId = document.getElementById('admin-target-id').value.trim();

            await _supabase.from('profiles').update({ is_admin: status }).eq('id', targetId);
            renderAdminsList(); loadUsers();
        }

            const text = document.getElementById('chan-post-text').value.trim();
            const img = document.getElementById('chan-post-img').value.trim();
            const video = document.getElementById('chan-post-video').value.trim();

            if (!text && !img && !video) return;

            if (video) {
                await _supabase.from('videos').insert([{ author_id: channelId, title: text || "Відео", url: video, likes: 0, liked_by: [] }]);
            } else {
                const finalContent = img ? `${text}\n\n${img}` : text;
                await _supabase.from('posts').insert([{ author_id: channelId, text: finalContent, likes: 0, liked_by: [] }]);
            }
            viewChannel(channelId);
        }

        async function loadChannelPosts(channelId) {
            const feed = document.getElementById('channel-feed');
            feed.innerHTML = '';

            const { data: posts } = await _supabase.from('posts').select('*').eq('author_id', channelId);
            const { data: videos } = await _supabase.from('videos').select('*').eq('author_id', channelId);

            let combined = [...(posts || []), ...(videos || [])];
            combined.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (combined.length === 0) {
                feed.innerHTML = '<div class="text-sub">Пусто.</div>';
                return;
            }

            combined.forEach(item => {
                const isVideo = item.url !== undefined; 
                const isLiked = (item.liked_by || []).includes(String(myId));
                const div = document.createElement('div');
                div.className = 'post';

                if (isVideo) {
                    div.innerHTML = `
                        <div class="post-header"><span><b>${item.title}</b></span></div>
                        <div class="post-body" style="padding:0; background:#000; text-align:center;">
                            <video controls style="width:100%; max-height:300px;"><source src="${item.url}" type="video/mp4"></video>
                        </div>
                        <div class="post-footer">
                            <button onclick="toggleVideoLike('${item.id}'); setTimeout(() => loadChannelPosts('${channelId}'), 500);" class="btn-like ${isLiked ? 'active' : ''}">&hearts; (${item.likes || 0})</button>
                        </div>
                    `;
                } else {
                    div.innerHTML = `
                        <div class="post-header"><span class="text-sub">${new Date(item.created_at).toLocaleString()}</span></div>
                        <div class="post-body">${parseContent(item.text)}</div>
                        <div class="post-footer">
                            <button onclick="toggleLike('${item.id}', '${channelId}', false); setTimeout(() => loadChannelPosts('${channelId}'), 500);" class="btn-like ${isLiked ? 'active' : ''}">&hearts; (${item.likes || 0})</button>
                        </div>
                    `;
                }
                feed.appendChild(div);
            });
        }

        async function toggleChannelSub(channelId, currentlySubbed) { if (currentlySubbed) await _supabase.from('channel_subscriptions').delete().eq('user_id', String(myId)).eq('channel_id', channelId); else await _supabase.from('channel_subscriptions').insert([{ user_id: String(myId), channel_id: channelId }]); viewChannel(channelId); }
        
        async function loadRecommendedChannels() {
            const list = document.getElementById('recommended-channels-list'); if (!list) return;
            const { data: channels } = await _supabase.from('channels').select('*').eq('is_private', false).limit(5);
            if (!channels || channels.length === 0) { list.innerHTML = '<span class="text-sub">Пусто.</span>'; return; }
            list.innerHTML = channels.map(c => `<div class="list-item" onclick="viewChannel('${c.id}')"><img src="${c.avatar_url}" class="avatar-sm"><div><b>${c.name}</b></div></div>`).join('');
        }

        async function loadSubscriptionsTab() {
            clearMainArea();
            const wall = document.getElementById('wall-posts');
            wall.innerHTML = '<div class="tab-header">Мої підписки</div>';

            wall.innerHTML += '<span class="section-title">Користувачі</span><div id="subs-users" class="scroll-area glass-panel card" style="max-height: 150px; background:#FFF;"></div>';
            wall.innerHTML += '<span class="section-title">Канали</span><div id="subs-channels" class="scroll-area glass-panel card" style="max-height: 150px; background:#FFF;"></div>';

            const { data: userSubs } = await _supabase.from('follows').select('following_id').eq('follower_id', String(myId));
            if (userSubs && userSubs.length > 0) {
                const ids = userSubs.map(s => s.following_id);
                const { data: users } = await _supabase.from('profiles').select('*').in('id', ids);
                document.getElementById('subs-users').innerHTML = users.map(u => `
                    <div class="list-item" onclick="viewProfile('${u.id}')">
                        <img src="${u.avatar_url || DEFAULT_AVATAR}" class="avatar-sm">
                        <div><b>${u.nickname}</b></div>
                    </div>`).join('');
            } else {
                document.getElementById('subs-users').innerHTML = '<div style="padding:5px;">Пусто.</div>';
            }

            const { data: chanSubs } = await _supabase.from('channel_subscriptions').select('channel_id').eq('user_id', String(myId));
            if (chanSubs && chanSubs.length > 0) {
                const cids = chanSubs.map(s => s.channel_id);
                const { data: channels } = await _supabase.from('channels').select('*').in('id', cids);
                document.getElementById('subs-channels').innerHTML = channels.map(c => `
                    <div class="list-item" onclick="viewChannel('${c.id}')">
                        <img src="${c.avatar_url || DEFAULT_AVATAR}" class="avatar-sm">
                        <div><b>${c.name}</b></div>
                    </div>`).join('');
            } else {
                document.getElementById('subs-channels').innerHTML = '<div style="padding:5px;">Пусто.</div>';
            }
        }
    </script>
</body>
</html>
